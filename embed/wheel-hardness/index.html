<style>
:root{--cream:#F7EEE5;--cream-deep:#EEE0D4;--ink:#2C2230;--coral:#E88A74;--lilac:#B7A2C4;--sage:#98AA96;--butter:#F0CD96}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;line-height:1.65}

.tw{overflow-x:auto}

a.cta,.res a.cta{display:block;text-align:center;margin:14px 0 10px;background:#E88A74;color:#2C2230;font-weight:600;font-size:1rem;line-height:1.3;text-decoration:none;padding:14px 16px;border-radius:4px;border:2px solid #F7EEE5;overflow-wrap:normal;word-break:normal}

body{background:#F7EEE5}

a.cta{display:block;text-align:center;margin:14px 0 10px;background:#E88A74;color:#2C2230;font-weight:600;font-size:1rem;line-height:1.3;text-decoration:none;padding:14px 16px;border-radius:4px;border:2px solid #F7EEE5}
a.cta:hover{background:#F0CD96}
.credit{text-align:center;font-size:.85rem;margin:10px 0 4px}
.credit a{color:#2C2230;text-decoration-color:#E88A74;text-underline-offset:3px}
.res ul a{color:#F0CD96}
#shared-by{font-weight:600;margin-bottom:0}
</style>
</head>
<body>
<!-- Version integrable, ecrite par build_embeds.py a partir de tools/wheel-hardness/index.html : ne pas modifier a la main. -->
<main class="embed">
<div class="tool" id="tool">
<div class="row">
<div><label for="skate">Skate type</label>
<select id="skate"><option value="quad">Quad (roller skates)</option><option value="inline">Inline (rollerblades)</option></select></div>
<div><label for="weight">Your weight (kg)</label><input id="weight" inputmode="decimal" placeholder="e.g. 65"></div>
</div>
<label for="surface">Where you skate most</label>
<select id="surface">
<option value="outdoor">Outdoors: asphalt, rough concrete, paths</option>
<option value="mixed">Smooth concrete, indoor and outdoor mix</option>
<option value="rink">Indoor rink or coated floor</option>
<option value="park">Skatepark: ramps, bowls</option>
<option value="derby-court">Roller derby: sport court or wood floor</option>
<option value="derby-slick">Roller derby: slick or polished concrete</option>
<option value="derby-sealed">Roller derby: sealed or coated concrete</option>
</select>
<label for="use">What you do on them</label>
<select id="use">
<option value="cruise">Learning, cruising, fitness</option>
<option value="tricks">Tricks, park, grinds</option>
<option value="distance">Long distance, speed (inline)</option>
</select>
<button id="go" type="button">Find my wheels</button>
<div id="out" aria-live="polite"></div>
</div>
<p class="credit" id="shared-by" hidden></p>
<p class="credit"><a href="https://rollerskateaesthetic.com/tools/wheel-hardness/?utm_source=embed&utm_medium=tool&utm_campaign=wheel-hardness" target="_blank" rel="noopener">Free tool by Roller Skate Aesthetic</a></p>
</main>
<script>

var SITE = 'https://rollerskateaesthetic.com', TOOL = 'wheel-hardness', VIA = 'wheel';
// 25/10/2026 : `via` = identifiant de suivi de l'outil, lu par le script via-tag des pages /guide/ (attribution outil -> achat Amazon).
function ourUrl(path){ return SITE + path + '?utm_source=embed&utm_medium=tool&utm_campaign=' + TOOL + (path.indexOf('/guide/') === 0 ? '&via=' + VIA : ''); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function host(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return ''; } }
function cta(text, path){ return '<a class="cta" href="' + ourUrl(path) + '" target="_blank" rel="noopener">' + text + '</a>'; }
// Fait defiler le document DU CADRE jusqu'a la reponse (jamais la page du club).
function showOut(html){ var o = document.getElementById('out'); o.innerHTML = html; window.scrollTo({top: Math.max(0, o.getBoundingClientRect().top + window.pageYOffset - 8), behavior: 'smooth'}); }
// Parametres du club : ?club=<nom> et ?accent=<RRGGBB>. Le nom est pose en textContent (jamais en HTML) ;
// la couleur n'est retenue que si elle fait exactement 6 chiffres hexadecimaux.
(function(){
  var p; try { p = new URLSearchParams(window.location.search); } catch(e){ return; }
  var club = (p.get('club') || '').replace(/\s+/g, ' ').trim().slice(0, 80);
  if (club) { var s = document.getElementById('shared-by'); s.textContent = 'Shared by ' + club; s.hidden = false; }
  var a = p.get('accent') || '';
  if (/^[0-9a-fA-F]{6}$/.test(a)) {
    var r = parseInt(a.slice(0,2),16), g = parseInt(a.slice(2,4),16), b = parseInt(a.slice(4,6),16);
    var fg = (0.299*r + 0.587*g + 0.114*b) > 150 ? '#2C2230' : '#F7EEE5';
    var st = document.createElement('style');
    st.textContent = 'button:not(.ghost),button:not(.ghost):hover,a.cta,a.cta:hover,.res a.cta,.res a.cta:hover{background:#' + a + ';color:' + fg + '}button:not(.ghost):hover,a.cta:hover,.res a.cta:hover{filter:brightness(1.08)}';
    document.head.appendChild(st);
  }
})();

/*DATA_START*/
var D = '2026-10-07', D_DERBY = '2026-10-09';
var S = {
  riedell:{name:'Riedell, Outdoor skating vs rink skating',url:'https://roller-blog.riedellskates.com/outdoor-skating-vs-rink-skating/'},
  moxi:{name:'Moxi, Wheels buying guide',url:'https://www.moxiskates.com/en-ca/pages/wheels-buying-guide'},
  ps:{name:'Powerslide, Wheel guide (PDF)',url:'https://cdn.shopify.com/s/files/1/0481/1119/0176/files/2_1_Wheel_Guide.pdf'},
  skatepro:{name:'SkatePro (retailer), Inline skate wheels guide',url:'https://www.skatepro.com/en-us/a15.htm'},
  bladeville:{name:'Bladeville (retailer), Hardness of inline skate wheels',url:'https://bladeville.com/blog/hardness-of-inline-skate-wheels'},
  hm:{name:'HockeyMonkey (retailer), Inline wheel hardness chart',url:'https://www.hockeymonkey.com/learn/inskate-wheels'},
  riedellDerby:{name:'Riedell, Choosing derby wheels by floor and position (31 Jul 2026)',url:'https://roller-blog.riedellskates.com/choosing-derby-wheels-by-floor-and-position/'},
  riedellCat:{name:'Riedell 2026 roller catalog: Radar Halo, derby, 38 mm x 59 mm',url:'https://roller.riedellskates.com/Portals/1/Images/PDFs/riedell-roller-catalog-2026-web.pdf'},
  atom:{name:'Atom Wheels performance matrix (Atom page on wftda.org)',url:'https://wftda.org/sponsors/atom-wheels'},
  bont:{name:'Bont, Roller skate wheels evolve (sponsored skater blog, 2020)',url:'https://bont.com/blogs/skate-reviews/roller-skate-wheels-evolve'}
};
// Weight bands (all surfaces, derby included): thresholds 150 lb / 190 lb from the HockeyMonkey chart (hockey wheels); used only to say "lower / upper end of the range".
var LIGHT = 68, HEAVY = 86;
function hardness(skate, surface, use){
  // Roller derby, flat track: Riedell's floor table (added 09/10/2026). Derby is skated on quads (WFTDA rules, section 1.2).
  var derbyInline = skate === 'inline' ? ' The WFTDA rules require quad skates for derby: inline skates are not permitted.' : '';
  if (surface === 'derby-court') return {derby:true, lo:88, hi:95, why:'Riedell recommends 88A-95A for derby on sport court and wood floors.', src:['riedellDerby','atom','bont'], note:'Sources differ: Atom gives 88A-97A on sport court depending on your weight, and a Bont blog post gives 95A-98A for sticky, freshly polished wood. Riedell itself gives 88A-93A for sport court in a second post (9 Sep 2026).' + derbyInline};
  if (surface === 'derby-slick') return {derby:true, lo:84, hi:88, why:'Riedell recommends softer wheels, 84A-88A, for derby on slick or polished concrete.', src:['riedellDerby','atom'], note:'Atom gives 86A-93A for slick surfaces, depending on your weight.' + ' The derby wheels on our rink wheels page are 93A and harder: on a slick floor, look for a wheel sold at 84A-88A.' + derbyInline};
  if (surface === 'derby-sealed') return {derby:true, lo:84, hi:90, why:'Riedell recommends 84A-90A for derby on sealed or coated floors.', src:['riedellDerby','atom'], note:'Sources disagree on coated floors: Riedell puts sealed or coated floors in a soft range, while Atom puts "coated/grippy" floors in its hardest range, 93A-100A.' + ' The derby wheels on our rink wheels page are 93A and harder: on a sealed floor, look for a wheel sold at 84A-90A.' + derbyInline};
  if (use === 'tricks' || surface === 'park') {
    if (skate === 'quad') return {lo:98, hi:101, why:'Park wheels are hard so they roll fast and slide on ramps and coping.', src:['moxi'], note:'Not covered by our skater’s ranges: this comes from Moxi only.'};
    return {lo:100, hi:110, why:'Aggressive grind wheels are very hard.', src:['ps','skatepro'], note:'Sources disagree: Powerslide says 100A–110A for aggressive grind wheels, SkatePro lists 88A–95A for aggressive wheels.'};
  }
  if (surface === 'outdoor') return {lo:78, hi:85, why:'Asphalt has grain. A soft wheel gives a little and absorbs it; a hard wheel sends it all into your feet.', src:['ando','riedell','moxi'], note: skate==='inline' ? 'Inline fitness wheels are often sold at 80A–88A (SkatePro) or 82A–90A (Powerslide), a little harder than this range.' : ''};
  if (surface === 'rink') return {lo:95, hi:101, open:true, why:'A rink floor is already smooth, so a hard wheel rolls faster there.', src:['ando','riedell','moxi'], note:'Riedell’s indoor range starts lower, at 88A (88A–101A). Our skater says 95A and up.'};
  // mixed smooth concrete
  if (skate === 'quad') return {lo:92, hi:96, why:'Between soft outdoor and hard rink wheels: enough roll on smooth floors, a bit of grip outside.', src:['moxi'], note:'Our skater gives no range for this in-between: Moxi’s Fundae (92A, street to park) and Sonar Riva (96A, coated floors and smooth concrete).'};
  return {lo:82, hi:90, why:'The most common inline hardness, for mixed smooth surfaces.', src:['ps'], note:'Our skater gives no range for this in-between: Powerslide says most wheels are 82A–90A.'};
}
function diameter(skate, surface, use){
  if (surface.indexOf('derby') === 0) return {lo:59, hi:62, src:['riedellCat']};
  if (skate === 'quad') {
    if (use === 'tricks' || surface === 'park') return {lo:52, hi:57, src:['moxi']};
    if (surface === 'outdoor') return {lo:62, hi:62, src:['moxi']};
    return {lo:57, hi:58, src:['moxi']};
  }
  if (use === 'tricks' || surface === 'park') return {lo:55, hi:72, src:['ps']};
  if (use === 'distance') return {lo:100, hi:125, src:['ps']};
  return {lo:76, hi:90, src:['ps']};
}
function recommend(skate, surface, use, kg){
  var w = parseFloat(String(kg).replace(',', '.'));
  if (isNaN(w) || w < 15 || w > 250) return {error:'Enter your weight in kg (e.g. 65).'};
  if (use === 'distance' && skate === 'quad') use = 'cruise';
  var h = hardness(skate, surface, use), d = diameter(skate, surface, use);
  var lean = w < LIGHT ? 'lower' : (w > HEAVY ? 'upper' : 'middle');
  var mid = Math.round((h.lo + h.hi) / 2);
  var pick = lean === 'lower' ? h.lo : (lean === 'upper' ? h.hi : mid);
  var weightWhy = lean === 'lower' ? 'You are light, so the softer end of the range will grip and absorb best.' :
                  lean === 'upper' ? 'You are heavier, so the harder end of the range will wear slower and roll better under you.' :
                  'Your weight sits in the middle, so the middle of the range is a safe start.';
  var src = h.src.concat(d.src, lean === 'middle' ? [] : ['bladeville','hm']).filter(function(v,i,a){return a.indexOf(v)===i;});
  return {hardness:h.open ? h.lo + 'A and up' : h.lo + 'A–' + h.hi + 'A', lo:h.lo, hi:h.hi, pick:pick, lean:lean,
    diameter: d.lo === d.hi ? d.lo + ' mm' : d.lo + '–' + d.hi + ' mm', dlo:d.lo, dhi:d.hi,
    why:h.why, weightWhy:weightWhy, note:h.note, src:src, derby:!!h.derby};
}
// Guide page for the result: hard wheels (88A and up: rink, derby, smooth concrete on quads, park) -> rink wheels;
// softer wheels (under 88A: outdoor, smooth concrete on inline) -> outdoor wheels. 88A is the start of Riedell's indoor range.
// Roller derby, whatever the floor -> rink wheels: that page covers the derby players' indoor wheels.
function destination(r){ return (r.derby || r.lo >= 88) ? 'rink-wheels-what-to-buy' : 'outdoor-wheels-what-to-buy'; }
/*BASED_START*/
// Ecrit par build_embeds.py (dictionnaire BASED) : ne pas modifier a la main.
var BASED = {
  'best-roller-skates-for-adult-beginners': [18, 'skaters, coaches and gear specialists'],
  'quad-vs-inline-skates-which-to-buy-first': [23, 'skaters, coaches and skate-industry figures'],
  'best-skates-for-wide-feet': [7, 'skaters and coaches'],
  'best-roller-skates-under-100': [12, 'skaters, coaches and specialist shops'],
  'outdoor-wheels-what-to-buy': [19, 'skaters, coaches and industry figures'],
  'rink-wheels-what-to-buy': [9, 'skaters and coaches'],
  'protective-gear-that-actually-fits': [24, 'skaters and coaches'],
  'first-roller-derby-skates': [15, 'skaters, 11 of them roller derby players,'],
  'first-quad-skates-for-rink-and-jam': [19, 'rink, jam, rhythm and dance skaters and coaches'],
  'first-quad-skates-for-skatepark': [6, 'park skaters, coaches and brand founders'],
  'outdoor-quad-skates': [5, 'skaters and coaches'],
  'first-fitness-inline-skates': [17, 'skaters, coaches and gear specialists'],
  'first-aggressive-skates': [18, 'aggressive bladers'],
  'skate-helmets-what-top-skaters-wear': [20, 'skaters and coaches'],
  'best-roller-skates-for-kids': [3, 'named coaches and skate schools']
};
function basedLine(slug, href){
  var b = BASED[slug]; if(!b) return '';
  return '<p class="note" style="color:#F7EEE5;margin-top:10px">Based on what ' + b[0] + ' ' + b[1] + ' recommend in our compilation of top skaters. ' +
    '<a style="color:#F0CD96" href="' + href + '">See the compilation</a></p>';
}
/*BASED_END*/
/*DATA_END*/

var $ = function(id){ return document.getElementById(id); };
// Destination : destination(), dans le bloc DATA de la page complete (88A et plus -> roues de piste ;
// moins de 88A -> roues de dehors).
$('go').addEventListener('click', function(){
  var r = recommend($('skate').value, $('surface').value, $('use').value, $('weight').value);
  if(r.error){ showOut('<div class="warn">' + esc(r.error) + '</div>'); return; }
  var srcs = r.src.map(function(k){ return k === 'ando' ? 'The skater behind Roller Skate Aesthetic (experienced skater)' : esc(S[k].name); }).join(' &middot; ');
  showOut('<div class="res"><div class="big">' + r.hardness + ' &middot; ' + r.diameter + '</div>' +
    cta('See wheels for where you skate &rarr;', '/guide/' + destination(r) + '/') + basedLine(destination(r), ourUrl('/guide/')) +
    '<p>Start around <strong>' + r.pick + 'A</strong>. ' + esc(r.why) + ' ' + esc(r.weightWhy) + '</p>' +
    '<p class="note">Sources, read ' + (r.derby ? D_DERBY : D) + ': ' + srcs + '</p></div>' +
    (r.note ? '<div class="warn">' + esc(r.note) + '</div>' : '') +
    '<p class="note">Check that your plate or frame takes this wheel size before buying.</p>');
});

</script>
</body>
