function label(b, r){ return b.sizeLabel ? b.sizeLabel(r) : b.kind + ' ' + r.label; }
// Does chart cell c hold shoe size v? Numbers, [low, high] ranges and kids labels ("7J" = kids 7).
function cellHas(c, v, kids){
  if(c == null) return false;
  if(Array.isArray(c)) return v >= c[0] && v <= c[1];
  if(kids) return String(c).replace(/\s|j|J|Y/g, '') === String(v);
  return String(c) === String(v);
}
function cellNum(c){ return Array.isArray(c) ? c[0] : Number(c); }
function recommend(brandKey, system, value, wide){
  const b = BRANDS[brandKey]; if(!b) return {error:'Unknown brand'};
  const v = Number(String(value).replace(',','.').replace(/\s|j|J|Y/g, ''));
  const notes = [];
  if(!(v>0)) return {error:'Enter a valid number'};
  let row, comfortRow = null;
  if(system === 'cm'){
    if(b.noLength) return {error: b.noLength};
    const rows = b.rows.filter(r => r.mm != null), max = rows[rows.length-1].mm, min = rows[0].mmMin || rows[0].mm;
    const foot = v*10;
    if(foot < 100 || foot > 400) return {error:'Foot length looks wrong: enter centimetres, e.g. 25.5'};
    const pick = add => rows.find(r => r.mm >= foot + add);
    row = pick(b.addMm[1]);
    if(b.addMm[1] > b.addMm[0]) comfortRow = pick(b.addMm[0]);
    if(!row) return {error:'Your foot is longer than the largest size on this chart (' + max/10 + ' cm).'};
    if(foot + b.addMm[1] < min) notes.push('Your foot is shorter than the smallest size on this chart; smallest size shown.');
    if(comfortRow && comfortRow !== row) notes.push('With the brand\'s smaller margin (+' + b.addMm[0] + ' mm): ' + label(b, comfortRow) + '.');
    if(b.lengthIs === 'insole length') notes.push('This chart gives the insole length of each size, not a foot length.');
    const also = rows.filter(r => r !== row && r.mmMin != null && foot >= r.mmMin && foot <= r.mm);
    if(also.length) notes.push('Your foot also fits the range of: ' + also.map(r => label(b, r)).join(', ') + '.');
  } else {
    if(b.noShoe) return {error: b.noShoe};
    const kids = system === 'kids';
    const col = b.rows.filter(r => r[system] != null);
    if(!col.length) return {error: kids ? 'This brand\'s chart has no US kids\' sizes: measure the foot in cm instead.' : 'This brand\'s chart has no ' + system + ' column.'};
    row = col.find(r => cellHas(r[system], v, kids));
    if(!row){
      if(kids) return {error:'That kids\' size is not on this chart. Measure the foot in cm instead.'};
      if(b.halfRule === 'up'){ row = col.find(r => cellNum(r[system]) > v); if(row) notes.push('No exact match: rounded up to the next full size, as the brand advises.'); }
      else { row = col.slice().sort((a,c) => Math.abs(cellNum(a[system])-v) - Math.abs(cellNum(c[system])-v))[0]; notes.push('No exact match on the chart: closest size shown. Measure your foot to be sure.'); }
    }
    if(!row) return {error:'That size is outside this brand\'s chart.'};
    notes.push('Shoe size to skate size is approximate. A foot measurement in mm is more reliable.');
  }
  if(row.widths) notes.push('Widths for this size: ' + row.widths + '.');
  const warnings = [];
  if(wide) warnings.push('Wide feet: ' + b.wide + ' Check width as well as length.');
  return {size: label(b, row), row, comfort: comfortRow ? label(b, comfortRow) : null, advice: b.advice, notes, warnings, source: b.source, retrieved: b.retrieved};
}

// Inline brands go to the inline guides: the wide-feet guide names quads only (fix of 23/11/2026).

function destination(wide, brandKey, system){
  if(system === 'kids' || /kids$/.test(brandKey || '')) return 'best-roller-skates-for-kids';
  if(INLINE_BRANDS.indexOf(brandKey) >= 0) return 'first-fitness-inline-skates';
  if(brandKey === 'roces') return 'first-aggressive-skates';
  return wide ? 'best-skates-for-wide-feet' : 'best-roller-skates-for-adult-beginners';
}
