<style>

body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

/*site header and footer*/

body{background:#F7EEE5}

</style>
</head>
<body>
<!-- Version integrable, ecrite par build_embeds.py a partir de tools/protective-gear-checklist/index.html : ne pas modifier a la main. -->
<main class="embed">
<div class="tool" id="tool">
<div class="row">
<div><label for="age">Who is skating?</label>
<select id="age"><option value="adult">Adult / teen</option><option value="kid">Child</option></select></div>
<div><label for="level">Level</label>
<select id="level"><option value="beginner">Beginner</option><option value="experienced">Experienced</option></select></div>
</div>
<div class="row">
<div><label for="practice">Type of skating</label>
<select id="practice">
<option value="cruise">Cruising / outdoor rides</option>
<option value="rink">Rink or indoor track</option>
<option value="park">Skatepark or ramp</option>
<option value="dance">Dance / jam skating</option>
<option value="downhill">Downhill / hills</option>
<option value="derby">Roller derby</option>
</select></div>
<div><label for="terrain">Ground</label>
<select id="terrain">
<option value="smooth">Smooth (rink floor, new tarmac)</option>
<option value="rough">Rough or cracked tarmac</option>
<option value="street">City streets</option>
<option value="wet">Can get wet</option>
</select></div>
</div>
<label for="brand">Size chart to use</label>
<select id="brand"></select>
<p class="note">Optional: your measurements in cm, taken with a soft tape. Leave blank to see the chart.</p>
<div class="row">
<div><label for="head">Head (cm)</label><input id="head" inputmode="decimal" placeholder="e.g. 56"></div>
<div><label for="knee">Knee (cm)</label><input id="knee" inputmode="decimal" placeholder="e.g. 38"></div>
</div>
<div class="row">
<div><label for="elbow">Elbow (cm)</label><input id="elbow" inputmode="decimal" placeholder="e.g. 25"></div>
<div><label for="wrist">Wrist guard (cm)</label><input id="wrist" inputmode="decimal" placeholder="e.g. 20"></div>
</div>
<label><input type="checkbox" id="shorts" style="width:auto;margin-right:8px">Show padded shorts too</label>
<div id="hipsWrap" hidden><label for="hips">Hips (cm)</label><input id="hips" inputmode="decimal" placeholder="e.g. 90"></div>
<button id="go" type="button">Build my checklist</button>
<div id="out" aria-live="polite"></div>
</div>
<p class="credit" id="shared-by" hidden></p>
<p class="credit"><a href="https://rollerskateaesthetic.com/tools/protective-gear-checklist/?utm_source=embed&utm_medium=tool&utm_campaign=protective-gear-checklist" target="_blank" rel="noopener">Free tool by Roller Skate Aesthetic</a></p>
</main>
<script>

var SITE = 'https://rollerskateaesthetic.com', TOOL = 'protective-gear-checklist', VIA = 'gear';
// 25/10/2026 : `via` = identifiant de suivi de l'outil, lu par le script via-tag des pages /guide/ (attribution outil -> achat Amazon).
function ourUrl(path){ return SITE + path + '?utm_source=embed&utm_medium=tool&utm_campaign=' + TOOL + (path.indexOf('/guide/') === 0 ? '&via=' + VIA : ''); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function host(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return ''; } }
function cta(text, path){ return '<a class="cta" href="' + ourUrl(path) + '" target="_blank" rel="noopener">' + text + '</a>'; }
// Fait defiler le document DU CADRE jusqu'a la reponse (jamais la page du club).
function showOut(html){ var o = document.getElementById('out'); o.innerHTML = html; window.scrollTo({top: Math.max(0, o.getBoundingClientRect().top + window.pageYOffset - 8), behavior: 'smooth'}); }
// Parametres du club : ?club=<nom> et ?accent=<RRGGBB>. Le nom est pose en textContent (jamais en HTML) ;
// la couleur n'est retenue que si elle fait exactement 6 chiffres hexadecimaux.
(function(){
  var p; try { p = new URLSearchParams(window.location.search); } catch(e){ return; }
  var club = (p.get('club') || '').replace(/\s+/g, ' ').trim().slice(0, 80);
  if (club) { var s = document.getElementById('shared-by'); s.textContent = 'Shared by ' + club; s.hidden = false; }
  var a = p.get('accent') || '';
  if (/^[0-9a-fA-F]{6}$/.test(a)) {
    var r = parseInt(a.slice(0,2),16), g = parseInt(a.slice(2,4),16), b = parseInt(a.slice(4,6),16);
    var fg = (0.299*r + 0.587*g + 0.114*b) > 150 ? '#2C2230' : '#F7EEE5';
    var st = document.createElement('style');
    st.textContent = 'button:not(.ghost),button:not(.ghost):hover,a.cta,a.cta:hover,.res a.cta,.res a.cta:hover{background:#' + a + ';color:' + fg + '}button:not(.ghost):hover,a.cta:hover,.res a.cta:hover{filter:brightness(1.08)}';
    document.head.appendChild(st);
  }
})();

/*DATA_START*/
const IN = 2.54;
// Ranges stored as printed by the brand, in inches; cm computed.
const BRANDS = {
  triple8: {
    name: 'Triple Eight',
    source: 'https://triple8.com/pages/fit-guide',
    helmetSource: 'https://triple8.com/products/the-certified-sweatsaver-helmet-color-collection-sunset',
    retrieved: '2026-10-07',
    models: {helmet:'THE Certified Sweatsaver', knee:'Street Knee', elbow:'Street Elbow', wrist:'Wristsaver', shorts:'Bumsaver'},
    helmet: [['XS/S',20,21.25],['S/M',21,22.5],['L/XL',22.5,23.5],['XL/XXL',23.5,24.5]],
    knee:   [['JR',11,12.5],['S',12.5,14.5],['M',14.5,16],['L',16,17]],
    elbow:  [['JR',5,6],['S',6,8],['M',8,10],['L',10,12]],
    wrist:  [['JR',6,7],['S',7,8],['M',8,9],['L',9,10]],
    shorts: [['JR',22,27],['S',26,30],['M',29,33],['L',32,38],['XL',36,42]],
    kidHelmet: 'Triple Eight Lil 8 kids\' helmet: one size, 46-52 cm (18"-20.5").',
    kidPack: 'Triple Eight Saver Series 3-pack: JR fits most children aged 5-8, XS fits most from age 8.'
  },
  killer187: {
    name: '187 Killer Pads',
    source: 'https://187killerpads.com/pages/fit-guide',
    retrieved: '2026-10-07',
    models: {helmet:'Helmets', knee:'Pro & Derby Knee', elbow:'Standard Elbow', wrist:'Wrist Guards'},
    helmet: [['S',20.5,21.25],['M',21.25,22],['L',22,23],['XL',23,23.75],['2XL',23.75,24.5]],
    knee:   [['JR',9,11],['XS',10,12],['S',12,14],['M',14,16],['L',15,17],['XL',17,20],['2XL',21,24]],
    elbow:  [['JR',6,8],['XS',7,8],['S',8,9],['M',10,11],['L',11,12],['XL',12,13],['2XL',13,14]],
    wrist:  [['JR',6,7],['XS',7,8],['S',8,9],['M',9,10],['L',10,11]],
    shorts: null,
    kidHelmet: null, kidPack: null
  }
};
const PIECES = [
  ['helmet','Helmet','The one you wear a hundred times for nothing and once for everything.'],
  ['wrist','Wrist guards','For the forward fall: the reflex to land on a bare palm is what breaks wrists.'],
  ['elbow','Elbow pads','For the backward fall: your elbows hit first, and nobody expects that one.'],
  ['knee','Knee pads','They let you drop forward on purpose instead of fighting to stay up.']
];
// Roller derby (added 09/10/2026): the WFTDA rules, read 2026-10-09. Only what the text says.
const WFTDA = {
  title: 'Roller derby equipment rule',
  doc: 'WFTDA, The Rules of Flat Track Roller Derby (version 20250101), Glossary: Protective Gear',
  url: 'https://rules.wftda.com/singlehtml/index.html',
  read: '2026-10-09',
  required: 'WFTDA rules: "Skaters must wear helmet, mouthguard, wrist guards, elbow pads, and knee pads so long as they provide additional protection and the Skater is physically able to wear them."',
  shell: 'WFTDA Risk Management Guidelines (updated October 2024), 4.1 Required Gear: wrist guards, elbow pads, knee pads and helmets "must have a hard-protective shell or inserts. Equipment must be worn per manufacturer\'s guidelines."',
  quads: 'The same rules (section 1.2, Equipment) say: "Skaters must wear quad-style roller skates and protective gear during play. Inline skates are not permitted."',
  riskUrl: 'https://static.wftda.com/insurance/wftda-risk-management-guidelines.pdf'
};
const MOUTHGUARD = ['mouthguard','Mouthguard','Required by the WFTDA rules for roller derby.'];
const LABEL = {helmet:'head', knee:'knee', elbow:'elbow', wrist:'wrist', shorts:'hips'};
const cm = x => Math.round(x*IN*10)/10;
function fmt(r){ return r[0] + ' (' + r[1] + '"-' + r[2] + '", ' + cm(r[1]) + '-' + cm(r[2]) + ' cm)'; }
function sizeFor(brandKey, piece, value){
  const b = BRANDS[brandKey]; if(!b) return {error:'Unknown brand'};
  const rows = b[piece]; if(!rows) return {error: b.name + ' publishes no ' + piece + ' chart.'};
  if(value === '' || value == null) return {chart: rows.map(fmt)};
  const v = Number(String(value).replace(',','.'));
  if(!(v>0)) return {error:'Enter a number in cm.'};
  const inch = v/IN, min = rows[0][1], max = rows[rows.length-1][2];
  if(inch < min - 0.001) return {error: v + ' cm is below the smallest ' + LABEL[piece] + ' size on this chart (' + cm(min) + ' cm). Look for a kids\' size.'};
  if(inch > max + 0.001) return {error: v + ' cm is above the largest ' + LABEL[piece] + ' size on this chart (' + cm(max) + ' cm).'};
  const fits = rows.filter(r => inch >= r[1]-0.001 && inch <= r[2]+0.001);
  let row, note = null;
  if(fits.length){ row = fits[fits.length-1]; if(fits.length > 1) note = 'You fit two sizes; the brand says to take the larger one.'; }
  else { row = rows.find(r => r[1] > inch); note = 'Between two sizes: sized up, as the brand advises.'; }
  return {size: row[0], row: fmt(row), note};
}
function checklist(o){
  const b = BRANDS[o.brand]; if(!b) return {error:'Unknown brand'};
  const items = PIECES.map(([k,name,why]) => ({key:k, name, why, model: b.models[k], fit: sizeFor(o.brand, k, o.m ? o.m[k] : '')}));
  if(o.practice === 'derby') items.push({key:'mouthguard', name:MOUTHGUARD[1], why:MOUTHGUARD[2], model:null, fit:{error:'No size chart in this tool: use the size guide of the mouthguard you buy.'}});
  if(o.shorts) items.push({key:'shorts', name:'Padded shorts (extra)', why:'The fall that hurts is backwards, onto your tailbone; padded shorts cover it.', model: b.models.shorts || null, fit: sizeFor(o.brand, 'shorts', o.m ? o.m.shorts : '')});
  const notes = [];
  // Derby: the WFTDA rule replaces the level note (the rules make all five required).
  if(o.practice === 'derby'){ notes.push(WFTDA.required); notes.push(WFTDA.shell); notes.push(WFTDA.quads); }
  else if(o.level === 'beginner') notes.push('Beginner: wear all four. None of them is optional on day one.');
  else notes.push('Leaving a piece off is your call once you know which falls you have, and your responsibility.');
  if(o.age === 'kid'){ notes.push('Children: use the JR (junior) rows.'); if(b.kidHelmet) notes.push(b.kidHelmet); if(b.kidPack) notes.push(b.kidPack); }
  if(o.practice === 'downhill') notes.push('Hills: a descent is only really enjoyable with the level for it, a good road, and no danger other than the fall itself: no traffic, nothing unpredictable.');
  if(o.practice === 'park') notes.push('Ramp and park: check the helmet\'s certification label. Triple Eight\'s Certified Sweatsaver lists both the US CPSC bike standard and ASTM F1492 for skating.');
  if(o.terrain === 'wet') notes.push('Wet ground: wet painted lines, along with gravel, are what actually make you fall.');
  if(o.terrain === 'rough' || o.terrain === 'street') notes.push('Gravel and wet painted lines are what actually make you fall: read the ground ahead.');
  return {brand: b.name, source: b.source, helmetSource: b.helmetSource || null, retrieved: b.retrieved, items, notes, rule: o.practice === 'derby' ? WFTDA : null};
}
// Guide page for the result: roller derby -> the derby guide (the one page that lists a mouthguard with the pads
// and helmet); everything else -> the protective gear guide.
function destination(practice){ return practice === 'derby' ? 'first-roller-derby-skates' : 'protective-gear-that-actually-fits'; }
/*BASED_START*/
// Ecrit par build_embeds.py (dictionnaire BASED) : ne pas modifier a la main.
var BASED = {
  'best-roller-skates-for-adult-beginners': [18, 'skaters, coaches and gear specialists'],
  'quad-vs-inline-skates-which-to-buy-first': [23, 'skaters, coaches and skate-industry figures'],
  'best-skates-for-wide-feet': [7, 'skaters and coaches'],
  'best-roller-skates-under-100': [12, 'skaters, coaches and specialist shops'],
  'outdoor-wheels-what-to-buy': [19, 'skaters, coaches and industry figures'],
  'rink-wheels-what-to-buy': [9, 'skaters and coaches'],
  'protective-gear-that-actually-fits': [24, 'skaters and coaches'],
  'first-roller-derby-skates': [15, 'skaters, 11 of them roller derby players,'],
  'first-quad-skates-for-rink-and-jam': [19, 'rink, jam, rhythm and dance skaters and coaches'],
  'first-quad-skates-for-skatepark': [6, 'park skaters, coaches and brand founders'],
  'outdoor-quad-skates': [5, 'skaters and coaches'],
  'first-fitness-inline-skates': [17, 'skaters, coaches and gear specialists'],
  'first-aggressive-skates': [18, 'aggressive bladers'],
  'skate-helmets-what-top-skaters-wear': [20, 'skaters and coaches'],
  'best-roller-skates-for-kids': [3, 'named coaches and skate schools']
};
function basedLine(slug, href){
  var b = BASED[slug]; if(!b) return '';
  return '<p class="note" style="color:#F7EEE5;margin-top:10px">Based on what ' + b[0] + ' ' + b[1] + ' recommend in our compilation of top skaters. ' +
    '<a style="color:#F0CD96" href="' + href + '">See the compilation</a></p>';
}
/*BASED_END*/
/*DATA_END*/

var $ = function(id){ return document.getElementById(id); };
Object.keys(BRANDS).forEach(function(k){ var op = document.createElement('option'); op.value = k; op.textContent = BRANDS[k].name; $('brand').appendChild(op); });
$('shorts').addEventListener('change', function(){ $('hipsWrap').hidden = !$('shorts').checked; });
$('go').addEventListener('click', function(){
  var r = checklist({age:$('age').value, level:$('level').value, practice:$('practice').value, terrain:$('terrain').value, brand:$('brand').value, shorts:$('shorts').checked,
    m:{helmet:$('head').value, knee:$('knee').value, elbow:$('elbow').value, wrist:$('wrist').value, shorts:$('hips').value}});
  if(r.error){ showOut('<div class="warn">' + esc(r.error) + '</div>'); return; }
  var li = r.items.map(function(it){
    var fit;
    if(it.fit.error) fit = '<br><span class="note">' + esc(it.fit.error) + '</span>';
    else if(it.fit.size) fit = '<br>Your size: <span class="size">' + esc(it.fit.size) + '</span> <span class="note">' + esc(it.fit.row) + (it.fit.note ? ' ' + esc(it.fit.note) : '') + '</span>';
    else fit = '<br><span class="note">' + esc(it.model) + ' chart: ' + it.fit.chart.map(esc).join(' &middot; ') + '</span>';
    return '<li><strong>' + esc(it.name) + '</strong> &mdash; ' + esc(it.why) + fit + '</li>';
  }).join('');
  // Destination : destination(), dans le bloc DATA de la page complete (derby -> guide derby ; sinon -> guide des protections).
  var dest = destination($('practice').value);
  showOut('<div class="res"><div class="big">Your checklist</div><ul>' + li + '</ul>' +
    cta(dest === 'first-roller-derby-skates' ? 'See derby gear: pads, helmet, mouthguard &rarr;' : 'See protective gear that fits &rarr;', '/guide/' + dest + '/') +
    basedLine(dest, ourUrl('/guide/')) +
    (r.rule ? '<p class="note">' + esc(r.rule.title) + ': ' + esc(r.rule.doc) + ' (read ' + esc(r.rule.read) + ').</p>' : '') +
    r.notes.map(function(n){ return '<p class="note">' + esc(n) + '</p>'; }).join('') +
    '<p class="note">Sizes: ' + esc(r.brand) + ' fit guide (retrieved ' + esc(r.retrieved) + '). In between sizes, take the larger one.</p></div>');
});

</script>
</body>
