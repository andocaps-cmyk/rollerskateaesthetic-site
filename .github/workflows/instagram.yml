# niveau : script — publication sans modele, zero jeton de modele ; pas de niveau au-dessus necessaire.
name: Publication Instagram

# Publie sur Instagram, par l'API officielle (graph.instagram.com), un carrousel par page du site (publier_instagram.py),
# refait le stock d'images servies sous /ig/ (publier_instagram.py --stocker), puis releve les chiffres du compte
# (releve_instagram.py, une fois par jour). Ecrit le 29/10/2026 (un document interne),
# sur le modele de threads.yml. Registre : _releves/publies_instagram.tsv.
# Trois passages par jour, chacun precede d'une attente au hasard de 0 a 25 min ; la garde du script fixe le plafond
# (2 par jour pendant 14 jours a compter de la premiere publication, 3 ensuite, 1 si _releves/alerte_instagram.txt
# existe) et l'ecart minimal de 3 heures. La fin de cette chaine relance la « Publication controlee », qui met en
# ligne les images neuves du stock.
on:
  schedule:
    - cron: "50 8 * * 1,4"
    - cron: "59 8 * * 2,5"
    - cron: "59 8 * * 0,3,6"
    - cron: "50 13 * * 1,4"
    - cron: "59 13 * * 2,5"
    - cron: "59 13 * * 0,3,6"
    - cron: "50 18 * * 1,4"
    - cron: "59 18 * * 2,5"
    - cron: "59 18 * * 0,3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = affiche sans publier"
        default: "true"
  # Declencheur de secours, comme threads.yml : modifier _releves/declencheur_instagram.txt (ligne dry_run=true|false).
  push:
    branches: [main]
    paths: ["_releves/declencheur_instagram.txt"]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Outils
        run: |
          pip install -q pillow
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || { sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core; }

      - name: Mode
        env:
          EVENT: ${{ github.event_name }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          HAS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN != '' }}
        run: |
          DRY_RUN=true
          if [ "$EVENT" = "schedule" ]; then DRY_RUN=false; fi
          if [ "$EVENT" = "workflow_dispatch" ]; then DRY_RUN="${IN_DRY:-true}"; fi
          if [ "$EVENT" = "push" ]; then
            v=$(sed -n 's/^dry_run=//p' _releves/declencheur_instagram.txt | head -1 | tr -d '\r '); [ -n "$v" ] && DRY_RUN="$v"
          fi
          if [ "$HAS_TOKEN" != "true" ] && [ "$DRY_RUN" = "false" ]; then
            # tant que le compte n'est pas relie, la chaine tourne a blanc (textes affiches) au lieu de rougir chaque jour
            echo "::warning::Secret INSTAGRAM_ACCESS_TOKEN absent : compte Instagram du projet pas encore relie (voir la documentation du projet). Passage a blanc."
            DRY_RUN=true
          fi
          echo "Mode: dry_run=$DRY_RUN (evenement $EVENT)"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"

      # 20/11/2026 : cadence de GTA en roller : on renouvelle des qu'il reste moins de 53 jours (60 - 7), au lieu de moins
      # de 20 (une seule fenetre). Un echec rend la chaine rouge en derniere etape, sans empecher la publication.
      # Le jeton long vit 60 jours. On le renouvelle une fois par jour au plus, quand il reste moins de 53 jours
      # (ou date inconnue), et on reecrit le secret si la chaine du jeton a change.
      - name: Renouveler le jeton si besoin
        id: renouveler
        if: env.DRY_RUN == 'false'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SECRETS_PAT: ${{ secrets.ROLLER_SECRETS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if grep -q "renouvele le $(date -u +%F)" _releves/jeton_instagram_expire.txt 2>/dev/null; then
            echo "Jeton deja renouvele aujourd'hui : pas de second renouvellement."; exit 0
          fi
          fin=$(grep -v '^#' _releves/jeton_instagram_expire.txt 2>/dev/null | head -1 | tr -d '\r ')
          if [ -n "$fin" ] && [ $(( ( $(date -d "$fin" +%s) - $(date +%s) ) / 86400 )) -ge 53 ]; then
            echo "Jeton valable jusqu'au $fin : pas de renouvellement."; exit 0
          fi
          python3 publier_instagram.py --rafraichir-jeton "$RUNNER_TEMP/jeton"
          if cmp -s <(printf %s "$INSTAGRAM_ACCESS_TOKEN") "$RUNNER_TEMP/jeton"; then echo "Meme jeton : secret inchange."; exit 0; fi
          if [ -z "$SECRETS_PAT" ]; then echo "::error::Jeton neuf mais ROLLER_SECRETS_PAT absent : secret non reecrit."; exit 1; fi
          pip install -q pynacl
          python3 - <<'EOF'
          import base64, json, os, urllib.request
          from nacl import encoding, public
          repo, pat = os.environ["REPO"], os.environ["SECRETS_PAT"]
          h = {"Authorization": "Bearer " + pat, "Accept": "application/vnd.github+json"}
          cle = json.load(urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/%s/actions/secrets/public-key" % repo, headers=h)))
          boite = public.SealedBox(public.PublicKey(cle["key"].encode(), encoding.Base64Encoder()))
          chiffre = base64.b64encode(boite.encrypt(open(os.environ["RUNNER_TEMP"] + "/jeton").read().encode())).decode()
          corps = json.dumps({"encrypted_value": chiffre, "key_id": cle["key_id"]}).encode()
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/%s/actions/secrets/INSTAGRAM_ACCESS_TOKEN" % repo,
              data=corps, headers=h, method="PUT"))
          print("Secret INSTAGRAM_ACCESS_TOKEN reecrit.")
          EOF
          rm -f "$RUNNER_TEMP/jeton"

      - name: Publier
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python3 publier_instagram.py --dry-run
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then python3 publier_instagram.py --max-posts 1 --attente-max 240
          else python3 publier_instagram.py --max-posts 1; fi

      - name: Refaire le stock d'images
        if: always()
        run: python3 publier_instagram.py --stocker

      - name: Relever les chiffres
        if: always() && env.DRY_RUN == 'false'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 releve_instagram.py

      - name: Pousser le registre et le stock
        if: always()
        run: |
          git config user.name "instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A ig
          git add $(ls _releves/publies_instagram.tsv _releves/echecs_instagram.tsv _releves/jeton_instagram_expire.txt \
                       _releves/alerte_instagram.txt _releves/suspension_instagram.json _releves/releve_instagram.csv _releves/releve_instagram_publications.csv 2>/dev/null)
          if git diff --cached --quiet; then echo "Registre et stock inchanges."; exit 0; fi
          git commit -m "Registre Instagram du $(date -u +%F)"
          git pull --rebase origin main && git push || { git pull --rebase origin main && git push; }

      - name: Rendre la chaine rouge si le renouvellement du jeton a echoue
        if: always() && steps.renouveler.outcome == 'failure'
        run: |
          echo "::error::Renouvellement du jeton Instagram en echec ; fin connue : $(grep -v '^#' _releves/jeton_instagram_expire.txt | head -1)"
          exit 1
